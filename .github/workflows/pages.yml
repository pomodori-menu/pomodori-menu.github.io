name: Deploy menu to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Her yayında veri sürümünü commit SHA ile damgala: ?v=<sha> sayesinde fiyat/ürün güncellemesi anında yansır.
      - name: Stamp data version
        run: echo "{\"v\":\"${GITHUB_SHA::10}\"}" > data/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
