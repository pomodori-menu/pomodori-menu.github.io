<!doctype html>
<html lang="tr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomodori — Menü</title>
<meta name="description" content="Pomodori taze makarna menüsü">
<meta name="theme-color" content="#f8f3e8">
<link rel="icon" href="data:,">
<link rel="preload" href="fonts/cormorant-500-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-500-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Copperplate: ticari font; lisanslı dosya fonts/ içinde. local() ilk sırada: cihazda kuruluysa (iOS/macOS) indirilmez. */
@font-face{font-family:"Copperplate";font-weight:400;font-display:swap;
  src:local("Copperplate"),local("Copperplate-Light"),url(fonts/copperplate.otf) format("opentype")}
@font-face{font-family:"Copperplate";font-weight:700;font-display:swap;
  src:local("Copperplate Bold"),local("Copperplate-Bold"),url(fonts/copperplate.otf) format("opentype")}
/* Cormorant Garamond (SIL OFL): açıklamalar. Yalnızca gereken karakter aralıkları indirilir. */
@font-face{font-family:"Cormorant Garamond";font-weight:500;font-display:swap;src:url(fonts/cormorant-500-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Cormorant Garamond";font-weight:500;font-display:swap;src:url(fonts/cormorant-500-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Amiri (SIL OFL): Arapça; yalnızca Arapça sayfada indirilir. */
@font-face{font-family:"AmiriAr";font-weight:400;font-display:swap;src:url(fonts/amiri-arabic-400.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+200C-200F,U+2010-2011,U+FB50-FDFF,U+FE70-FE7F}

:root{
  --red:#a3171c;        /* marka kırmızısı, şarap/domates tonuna çekildi */
  --ink:#1c1a17;
  --mute:#6b645a;
  --gold:#b8a070;
  --line:#e0d5bd;
  --bg:#f8f3e8;
  --f-head:"Copperplate","Copperplate Gothic Light",Optima,"Trebuchet MS",Candara,sans-serif;
  --f-desc:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-text:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --nav-h:3.25rem;
}
html[lang=ar]{
  --f-head:"Copperplate","Copperplate Gothic Light","AmiriAr","Geeza Pro","Noto Naskh Arabic","Droid Arabic Naskh",Tahoma,serif;
  --f-desc:"AmiriAr","Geeza Pro","Noto Naskh Arabic","Droid Arabic Naskh",Tahoma,serif;--f-text:var(--f-desc);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-block-start:calc(var(--nav-h) + 1rem)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:500 clamp(1rem,4.2vw,1.125rem)/1.45 var(--f-desc);
  padding-inline:max(1.1rem,env(safe-area-inset-left)) max(1.1rem,env(safe-area-inset-right));padding-block-end:env(safe-area-inset-bottom)}
.wrap{max-width:40rem;margin-inline:auto}
button{font:inherit;color:inherit}
.orn{display:flex;align-items:center;justify-content:center;gap:.6rem;color:var(--gold)}
.orn::before,.orn::after{content:"";width:2.6rem;height:1px;background:currentColor}
.orn i{width:.32rem;height:.32rem;background:currentColor;transform:rotate(45deg)}

/* Üst bölüm */
header{position:relative;padding-block:1.6rem .4rem;text-align:center}
.logo{margin:0 0 .85rem;font:700 clamp(1.7rem,7.6vw,2.6rem)/1 var(--f-head);letter-spacing:.28em;padding-inline-start:.28em;color:var(--red);text-transform:uppercase}
.langs{direction:ltr;display:flex;justify-content:center;align-items:center;margin:.7rem 0 0;padding:0;list-style:none}
.langs li+li::before{content:"·";color:var(--gold);padding-inline:.1rem}
.langs li{display:flex;align-items:center}
.langs button{min-width:2.75rem;min-height:2.75rem;padding:0 .35rem;border:0;background:none;position:relative;
  font:700 .78rem/1 var(--f-head);color:var(--mute);letter-spacing:.14em;cursor:pointer;-webkit-tap-highlight-color:transparent}
.langs button[aria-pressed=true]{color:var(--red)}
.langs button[aria-pressed=true]::after{content:"";position:absolute;inset-inline:.4rem;bottom:.55rem;height:1.5px;background:var(--red)}
.langs button:focus-visible,.cats a:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* Yapışkan kategori çubuğu */
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-block:1px solid var(--line);margin-inline:calc(-1 * max(1.1rem,env(safe-area-inset-left)));margin-block-start:.4rem}
.cats{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-inline:max(.5rem,env(safe-area-inset-left));min-height:var(--nav-h);align-items:center;overscroll-behavior-x:contain}
.cats::-webkit-scrollbar{display:none}
.cats a{flex:none;position:relative;display:flex;align-items:center;min-height:2.75rem;padding:0 .9rem;color:var(--mute);text-decoration:none;
  font:700 .74rem/1 var(--f-head);text-transform:uppercase;letter-spacing:.16em;white-space:nowrap;-webkit-tap-highlight-color:transparent}
html[lang=ar] .cats a{text-transform:none;letter-spacing:0;font:400 1.05rem/1 var(--f-head)}
.cats a[aria-current=true]{color:var(--red)}
.cats a[aria-current=true]::after{content:"";position:absolute;inset-inline:.9rem;bottom:.55rem;height:1.5px;background:var(--red)}

/* Menü */
main{min-height:70vh;padding-block-end:1rem}
section{padding-block-start:2.8rem}
h2{margin:0 0 1.5rem;text-align:center;font:400 clamp(1.3rem,5.8vw,1.75rem)/1.2 var(--f-head);color:var(--ink);text-transform:uppercase;letter-spacing:.2em;padding-inline-start:.2em}
h2::after{content:"";display:block;width:2.4rem;height:1px;background:var(--gold);margin:.85rem auto 0}
html[lang=ar] h2{text-transform:none;letter-spacing:0;padding:0;font-weight:400;font-size:clamp(1.5rem,6.4vw,1.9rem)}
.item{padding-block:.8rem;position:relative}
.row{display:flex;align-items:baseline;gap:.6rem}
.name{margin:0;font:400 clamp(1.15rem,5.2vw,1.45rem)/1.22 var(--f-head);letter-spacing:.005em;color:var(--ink);flex:0 1 auto;min-width:0;overflow-wrap:anywhere}
html[lang=ar] .name{letter-spacing:0}
.ld{flex:1;min-width:0;align-self:baseline;border-bottom:1px dotted var(--gold);transform:translateY(-.3em)}
.price{flex:none;font:400 clamp(1rem,4.4vw,1.15rem)/1.25 var(--f-head);color:var(--ink);white-space:nowrap;
  direction:ltr;unicode-bidi:isolate;font-variant-numeric:lining-nums tabular-nums}
.desc{margin:.3rem 0 0;color:#3b372f;font:500 clamp(1rem,4.3vw,1.12rem)/1.4 var(--f-desc);letter-spacing:.004em;max-width:34rem}
html[lang=ar] .desc{line-height:1.85;letter-spacing:0;font-weight:400;font-size:clamp(1rem,4.2vw,1.12rem)}
.compact .item{padding-block:.5rem}
.compact .name{font-size:clamp(1.08rem,4.8vw,1.25rem)}
.vp{position:relative;flex:none}
.vbtn{display:inline-flex;align-items:center;gap:.3rem;min-height:2.75rem;margin-block:-.7rem;padding:0 .15rem;border:0;background:none;color:var(--ink);
  font-family:var(--f-head);font-weight:400;font-size:clamp(1rem,4.4vw,1.15rem);line-height:1.25;cursor:pointer;-webkit-tap-highlight-color:transparent}
.vbtn .p{direction:ltr;unicode-bidi:isolate;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.vbtn .c{width:.45rem;height:.45rem;border-inline-end:1.5px solid var(--red);border-block-end:1.5px solid var(--red);transform:rotate(45deg) translate(-.1rem,-.1rem);transition:transform .15s}
.vbtn[aria-expanded=true] .c{transform:rotate(-135deg) translate(-.1rem,-.1rem)}
.vbtn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.pop{position:absolute;inset-inline-end:0;top:calc(100% + .25rem);z-index:4;min-width:12rem;background:#fffcf5;border:1px solid var(--gold);border-radius:.3rem;
  box-shadow:0 10px 28px rgba(60,40,10,.14);padding:.2rem .95rem}
.pop div{display:flex;justify-content:space-between;align-items:baseline;gap:1.25rem;padding:.6rem 0;font:500 1.05rem/1.3 var(--f-desc)}
.pop div+div{border-block-start:1px solid var(--line)}
.pop b{font:400 1rem/1.3 var(--f-head);direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.pop div>span:first-child{white-space:nowrap}
.st{display:inline-block;width:.75em;height:.75em;margin-inline-start:.45em;vertical-align:-.02em;fill:var(--red);flex:none}
.vbtn .st{margin-inline-start:.1rem;width:.68em;height:.68em}
.pop .st{margin-inline-start:.3em}
.sl{margin-inline-start:.35em;font:700 .6rem/1 var(--f-head);color:var(--red);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;vertical-align:.12em}
html[lang=ar] .sl{letter-spacing:0;text-transform:none;font:400 .85rem/1 var(--f-head)}
.pop .sl{vertical-align:baseline}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.legend{margin:1.5rem 0 0;padding:.7rem 0;border-block:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:.55rem;text-align:center;
  font:500 1rem/1.3 var(--f-desc);color:var(--mute)}
.legend .st{margin:0;width:.85em;height:.85em;flex:none}
.legend b{font:700 .72rem/1.3 var(--f-head);color:var(--red);letter-spacing:.16em;text-transform:uppercase}
html[lang=ar] .legend b{letter-spacing:0;text-transform:none;font:400 1rem/1.3 var(--f-head)}
.igl{position:absolute;inset-inline-end:-.55rem;top:.7rem;display:flex;align-items:center;justify-content:center;width:2.75rem;height:2.75rem;color:var(--mute);-webkit-tap-highlight-color:transparent}
.igi{width:1.35rem;height:1.35rem}
.igl:focus-visible,.fig:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.fig{display:inline-flex;align-items:center;gap:.5rem;min-height:2.75rem;margin-block-start:.6rem;padding:0 .5rem;color:var(--mute);text-decoration:none;font:700 .78rem/1 var(--f-head);letter-spacing:.12em}
.fig .igi{width:1.15rem;height:1.15rem}
bdi{unicode-bidi:isolate}
footer{margin-block-start:3rem;padding-block:0 2.5rem;text-align:center;color:var(--ink);font:500 1.08rem/1.55 var(--f-desc)}
footer::before{content:"";display:block;width:2.4rem;height:1px;background:var(--gold);margin:0 auto 1.6rem}
footer small{display:block;margin-block-start:.75rem;color:var(--mute);font:500 .95rem/1.4 var(--f-desc)}
html[lang=ar] footer{line-height:1.9}
.msg{padding:3rem 0;text-align:center;color:var(--mute)}
.msg button{margin-block-start:1rem;min-height:2.75rem;padding:0 1.25rem;border:1px solid var(--red);border-radius:.3rem;background:none;color:var(--red);font-weight:700;cursor:pointer}
@media (min-width:48em){.item{padding-block:1rem}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo">POMODORI</h1>
    <div class="orn" aria-hidden="true"><i></i></div>
    <a class="igl" id="igl" href="https://www.instagram.com/dapomodori/" target="_blank" rel="noopener noreferrer" aria-label="Instagram: @dapomodori"><svg class="igi" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.3" cy="6.7" r="1.2" fill="currentColor"/></svg></a>
    <ul class="langs" id="langs" aria-label="Dil / Language">
      <li><button type="button" data-l="tr" lang="tr" aria-pressed="true">TR</button></li>
      <li><button type="button" data-l="en" lang="en" aria-pressed="false">EN</button></li>
      <li><button type="button" data-l="de" lang="de" aria-pressed="false">DE</button></li>
      <li><button type="button" data-l="it" lang="it" aria-pressed="false">IT</button></li>
      <li><button type="button" data-l="ar" lang="ar" aria-pressed="false">عربي</button></li>
    </ul>
  </header>
  <nav id="nav" aria-label="Kategoriler"><div class="cats" id="cats"></div></nav>
  <main id="menu" aria-live="polite"></main>
  <footer id="foot"></footer>
</div>
<noscript><p style="text-align:center;padding:2rem">Menü için JavaScript gerekli / JavaScript is required.</p></noscript>
<script>
(function(){
"use strict";
var LANGS=["tr","en","de","it","ar"],$=function(i){return document.getElementById(i)};
var menu=$("menu"),cats=$("cats"),foot=$("foot"),cur="",io=null,req=0;

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function pickLang(){
  var q=(location.search.match(/[?&]lang=([a-z]{2})/)||[])[1];
  var s=store("lang");
  return LANGS.indexOf(q)>-1?q:LANGS.indexOf(s)>-1?s:"tr";
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

/* Sürüm: version.json her zaman doğrulanır (ETag ile 304, ~birkaç bayt). Veri dosyaları ?v=<sürüm> ile
   adreslenir; sürüm değişmedikçe tarayıcı önbelleğinden gelir, değiştiğinde anında yenilenir. */
function getJSON(url,opt){return fetch(url,opt).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function version(){return getJSON("data/version.json",{cache:"no-cache"}).then(function(j){return j.v}).catch(function(){return store("ver")||"0"})}

function load(lang){
  var id=++req;
  menu.innerHTML='<p class="msg">…</p>';
  version().then(function(v){
    store("ver",v);
    return Promise.all([getJSON("data/menu-"+lang+".json?v="+v),getJSON("data/prices.json?v="+v)]);
  }).then(function(r){ if(id===req) render(lang,r[0],r[1]); })
  .catch(function(){ if(id!==req)return;
    menu.innerHTML='<div class="msg"><p>Menü yüklenemedi · Could not load the menu</p><button type="button" id="retry">↻</button></div>';
    $("retry").onclick=function(){load(lang)};
  });
}

/* Her bölümde ürünler ucuzdan pahalıya (seçenekli ürünlerde en düşük fiyat); eşitlikte menü sırası korunur. */
function lowest(p){if(p==null)return Infinity;if(typeof p==="object"){var v=Object.keys(p).map(function(k){return p[k]});return v.length?Math.min.apply(null,v):Infinity}return p}
function sortItems(items,pr){return items.map(function(it,i){return{it:it,i:i,p:lowest(pr[it.id])}}).sort(function(a,b){return a.p-b.p||a.i-b.i}).map(function(x){return x.it})}
var STAR='<svg class="st" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.4l2.7 5.7 6.2.8-4.6 4.3 1.2 6.1L10 15.2 4.5 18.3l1.2-6.1L1.1 7.9l6.2-.8z"/></svg>';
function render(lang,d,p){
  var de=document.documentElement;
  de.lang=lang;de.dir=d.dir;cur=lang;
  document.title=d.ui.title;
  var m=document.querySelector('meta[name=description]');if(m)m.content=d.ui.desc;
  $("nav").setAttribute("aria-label",d.ui.nav);
  $("langs").setAttribute("aria-label",d.ui.lang);
  Array.prototype.forEach.call(document.querySelectorAll("#langs button"),function(b){b.setAttribute("aria-pressed",String(b.dataset.l===lang))});
  var cur_=p.currency,pr=p.prices,nav="",html="";
  var anySig=d.categories.some(function(c){return c.items.some(function(it){return it.sig||(it.variants||[]).some(function(v){return v.sig})})});
  d.categories.forEach(function(c){
    if(!c.items.length)return; /* boş kategori müşteriye gösterilmez */
    nav+='<a href="#c-'+c.id+'" data-c="c-'+c.id+'">'+esc(c.name)+'</a>';
    html+='<section id="c-'+c.id+'"'+(c.compact?' class="compact"':'')+'><h2>'+esc(c.name)+'</h2>';
    sortItems(c.items,pr).forEach(function(it){
      var price=pr[it.id],ph="";
      if(price!=null&&typeof price==="object"&&it.variants&&it.variants.length){
        var vs=it.variants.filter(function(v){return price[v.k]!=null}),min=Math.min.apply(null,vs.map(function(v){return price[v.k]}));
        ph='<span class="vp"><button type="button" class="vbtn" aria-expanded="false" aria-controls="v-'+esc(it.id)+'"><span class="p">'+min+'&nbsp;'+cur_+'</span>'+(vs.some(function(v){return v.sig})?STAR:'')+'<span class="c" aria-hidden="true"></span></button>'+
          '<span class="pop" id="v-'+esc(it.id)+'" hidden>'+vs.map(function(v){return'<div><span>'+esc(v.name)+(v.sig?STAR+'<span class="sl">'+esc(d.ui.sig||'')+'</span>':'')+'</span><b>'+price[v.k]+'&nbsp;'+cur_+'</b></div>'}).join("")+'</span></span>';
      }else if(price!=null)ph='<span class="price">'+price+'&nbsp;'+cur_+'</span>';
      html+='<article class="item"><div class="row"><h3 class="name"><bdi>'+esc(it.name)+'</bdi>'+(it.sig?STAR+'<span class="sl">'+esc(d.ui.sig||'')+'</span>':'')+'</h3>'+(ph?'<span class="ld" aria-hidden="true"></span>':'')+ph+'</div>'+
        (it.desc?'<p class="desc">'+esc(it.desc)+'</p>':'')+'</article>';
    });
    html+='</section>';
  });
  if(anySig&&d.ui.sig)html='<p class="legend">'+STAR+'<span><b>'+esc(d.ui.sig)+'</b>'+(d.ui.sigNote?' · '+esc(d.ui.sigNote):'')+'</span></p>'+html;
  cats.innerHTML=nav;menu.innerHTML=html;
  foot.innerHTML=esc(d.ui.note)+'<small>'+esc(d.ui.currencyNote)+'</small><a class="fig" href="https://www.instagram.com/dapomodori/" target="_blank" rel="noopener noreferrer">'+'<svg class="igi" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.3" cy="6.7" r="1.2" fill="currentColor"/></svg>'+'<span>@dapomodori</span>'+(d.ui.follow?'<span class="sr">'+esc(d.ui.follow)+'</span>':'')+'</a>';
  $("igl").setAttribute("aria-label",(d.ui.follow||'Instagram')+': @dapomodori');
  cats.scrollLeft=0;
  spy();
}

/* Aktif kategoriyi vurgula */
function spy(){
  if(io)io.disconnect();
  if(!("IntersectionObserver" in window))return;
  var links={};Array.prototype.forEach.call(cats.children,function(a){links[a.dataset.c]=a});
  io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting)return;
      Object.keys(links).forEach(function(k){links[k].removeAttribute("aria-current")});
      var a=links[e.target.id];if(!a)return;
      a.setAttribute("aria-current","true");
      var l=a.offsetLeft,w=cats.clientWidth,rtl=document.dir==="rtl"||document.documentElement.dir==="rtl";
      if(!rtl){cats.scrollTo({left:l-(w-a.offsetWidth)/2,behavior:"smooth"})}
      else a.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
    });
  },{rootMargin:"-30% 0px -65% 0px"});
  Array.prototype.forEach.call(menu.querySelectorAll("section"),function(s){io.observe(s)});
}

function closePops(except){Array.prototype.forEach.call(document.querySelectorAll(".pop:not([hidden])"),function(p){if(p!==except){p.hidden=true;p.previousElementSibling.setAttribute("aria-expanded","false")}})}
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest(".vbtn");
  if(!b){if(!(e.target.closest&&e.target.closest(".pop")))closePops();return}
  var pop=b.nextElementSibling,open=pop.hidden;closePops(pop);pop.hidden=!open;b.setAttribute("aria-expanded",String(open));
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closePops()});
$("langs").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.dataset.l===cur)return;
  store("lang",b.dataset.l);
  try{var u=new URL(location.href);u.searchParams.delete("lang");history.replaceState(null,"",u)}catch(x){}
  load(b.dataset.l);
});
load(pickLang());
})();
</script>
</body>
</html>
